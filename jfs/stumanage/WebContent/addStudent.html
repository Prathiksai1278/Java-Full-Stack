<!doctype html>
<html>
<head>
<title>Add Student</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:0;}
.container{max-width:500px;margin:60px auto;background:white;padding:30px;border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);}h2{text-align:center;color:#333;}
form{margin-top:20px;}label{display:block;margin-bottom:12px;color:#333;}
input,select{width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;}
button{margin-top:15px;padding:10px 18px;background:#28a745;color:white;border:none;border-radius:4px;cursor:pointer;}
button:hover{background:#218838;}
.home-link{text-decoration:none;color:#007bff;margin-top:10px;display:inline-block;}
</style>
</head>
<body>
<div class="container"><h2>Add Student</h2>
<form action="add" method="post">
<label>Roll No:<input type="number" name="rollno" required></label>
<label>Name:<input type="text" name="name" required></label>
<label>Age:<input type="number" name="age" required></label>
<label>Gender:<select name="gender"><option>Male</option><option>Female</option>
<option>Other</option></select></label>
<label>Email:<input type="email" name="email" required></label>
<button type="submit">Add</button>
</form><a href="index.html" class="home-link">Home</a></div>
</body></html>
